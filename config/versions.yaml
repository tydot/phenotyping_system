      consensus_labels: "H:/windows/图像数据/dataProcess/rerun_outputs_02468_pca50/attn/topk6/consensus_labels_all.csv"
      clinical_with_clusters: "H:/windows/图像数据/dataProcess/processed/M5/merged_clinical_all.csv"
      kruskal_stable: "H:/windows/图像数据/dataProcess/processed/M5/stats/M5_旧随机_Attn_topk6_kruskal.csv"
      dunn_stable: "H:/windows/图像数据/dataProcess/processed/M5/stats/M5_旧随机_Attn_topk6_dunn.csv"
      rair_validation: "H:/windows/图像数据/dataProcess/processed/M5/rair_validation.csv"
      rome_cross_table: "H:/windows/图像数据/dataProcess/processed/M5/rome_ai_cross_table.csv"
      umap_figure: "H:/windows/图像数据/dataProcess/processed/M5/umap_consensus_clusters.png"