default_version: "M1_新公平_Attn_topk4"

version_order:
  - "M1_新公平_Attn_topk4"
  - "M2_新公平_Attn_topk6"
  - "M3_新公平_Mean_all"
  - "M4_旧随机_Mean_topk4"
  - "M5_旧随机_Attn_topk6"

versions:
  M1_新公平_Attn_topk4:
    display_name: "M1 - 新公平 Attention K4"
    short_name: "M1"
    role: "main"
    description: "主实验版本：采用新公平确定性抽帧策略，基于 Attention Pooling，选取每个协议中最具代表性的 Top-4 帧。"
    sampling_strategy: "deterministic"
    sampling_name: "新公平确定性抽帧"
    pooling: "attention"
    method: "确定性抽帧 + Attention Pooling + top-k=4"
    top_k: 4
    n_clusters: 3
    boundary_threshold: 0.8
    files:
      consensus_labels: "H:/windows/图像数据/dataProcess/outputs/fair_compare_multi_dim/attn/topk4/pca50/consensus_labels_all.csv"
      clinical_with_clusters: "H:/windows/图像数据/dataProcess/outputs/fair_compare_multi_dim/attn/topk4/pca50/merged_clinical_all.csv"
      kruskal_stable: "H:/windows/图像数据/dataProcess/processed/M1/stats/M1_新公平_Attn_topk4_kruskal.csv"
      dunn_stable: "H:/windows/图像数据/dataProcess/processed/M1/stats/M1_新公平_Attn_topk4_dunn.csv"
      rair_validation: "H:/windows/图像数据/dataProcess/processed/M1/rair_validation.csv"
      rome_cross_table: "H:/windows/图像数据/dataProcess/processed/M1/rome_ai_cross_table.csv"
      umap_figure: "H:/windows/图像数据/dataProcess/processed/M1/umap_consensus_clusters.png"

  M2_新公平_Attn_topk6:
    display_name: "M2 - 新公平 Attention K6"
    short_name: "M2"
    role: "ablation"
    description: "消融对照版本：采用新公平确定性抽帧策略，基于 Attention Pooling，选取每个协议中最具代表性的 Top-6 帧。"
    sampling_strategy: "deterministic"
    sampling_name: "新公平确定性抽帧"
    pooling: "attention"
    method: "确定性抽帧 + Attention Pooling + top-k=6"
    top_k: 6
    n_clusters: 3
    boundary_threshold: 0.8
    files:
      consensus_labels: "H:/windows/图像数据/dataProcess/outputs/fair_compare_multi_dim/attn/topk6/pca50/consensus_labels_all.csv"
      clinical_with_clusters: "H:/windows/图像数据/dataProcess/outputs/fair_compare_multi_dim/attn/topk6/pca50/merged_clinical_all.csv"
      kruskal_stable: "H:/windows/图像数据/dataProcess/processed/M2/stats/M2_新公平_Attn_topk6_kruskal.csv"
      dunn_stable: "H:/windows/图像数据/dataProcess/processed/M2/stats/M2_新公平_Attn_topk6_dunn.csv"
      rair_validation: "H:/windows/图像数据/dataProcess/processed/M2/rair_validation.csv"
      rome_cross_table: "H:/windows/图像数据/dataProcess/processed/M2/rome_ai_cross_table.csv"
      umap_figure: "H:/windows/图像数据/dataProcess/processed/M2/umap_consensus_clusters.png"

  M3_新公平_Mean_all:
    display_name: "M3 - 新公平 Mean 全部帧"
    short_name: "M3"
    role: "ablation"
    description: "消融对照版本：采用新公平确定性抽帧策略，基于 Mean Pooling，保留全部有效帧进行协议级聚合。"
    sampling_strategy: "deterministic"
    sampling_name: "新公平确定性抽帧"
    pooling: "mean"
    method: "确定性抽帧 + Mean Pooling + 全部帧"
    top_k: 0
    top_k_note: "top_k=0 表示不进行 top-k 截断，使用全部有效帧。"
    n_clusters: 3
    boundary_threshold: 0.8
    files:
      consensus_labels: "H:/windows/图像数据/dataProcess/outputs/fair_compare_multi_dim/mean/topk0/pca50/consensus_labels_all.csv"
      clinical_with_clusters: "H:/windows/图像数据/dataProcess/outputs/fair_compare_multi_dim/mean/topk0/pca50/merged_clinical_all.csv"
      kruskal_stable: "H:/windows/图像数据/dataProcess/processed/M3/stats/M3_新公平_Mean_all_kruskal.csv"
      dunn_stable: "H:/windows/图像数据/dataProcess/processed/M3/stats/M3_新公平_Mean_all_dunn.csv"
      rair_validation: "H:/windows/图像数据/dataProcess/processed/M3/rair_validation.csv"
      rome_cross_table: "H:/windows/图像数据/dataProcess/processed/M3/rome_ai_cross_table.csv"
      umap_figure: "H:/windows/图像数据/dataProcess/processed/M3/umap_consensus_clusters.png"

  M4_旧随机_Mean_topk4:
    display_name: "M4 - 旧随机 Mean K4"
    short_name: "M4"
    role: "ablation"
    description: "旧方法对照版本：采用随机受限抽帧策略，基于 Mean Pooling，每个协议最多保留 4 帧。"
    sampling_strategy: "random_limited"
    sampling_name: "旧随机受限抽帧"
    pooling: "mean"
    method: "随机受限抽帧 + Mean Pooling + 最多4帧"
    top_k: 4
    n_clusters: 3
    boundary_threshold: 0.8
    files:
      consensus_labels: "H:/windows/图像数据/dataProcess/rerun_outputs/mean/mapp4/consensus_labels_all.csv"
      clinical_with_clusters: "H:/windows/图像数据/dataProcess/processed/M4/merged_clinical_all.csv"
      kruskal_stable: "H:/windows/图像数据/dataProcess/processed/M4/stats/M4_旧随机_Mean_topk4_kruskal.csv"
      dunn_stable: "H:/windows/图像数据/dataProcess/processed/M4/stats/M4_旧随机_Mean_topk4_dunn.csv"
      rair_validation: "H:/windows/图像数据/dataProcess/processed/M4/rair_validation.csv"
      rome_cross_table: "H:/windows/图像数据/dataProcess/processed/M4/rome_ai_cross_table.csv"
      umap_figure: "H:/windows/图像数据/dataProcess/processed/M4/umap_consensus_clusters.png"

  M5_旧随机_Attn_topk6:
    display_name: "M5 - 旧随机 Attention K6"
    short_name: "M5"
    role: "ablation"
    description: "旧方法对照版本：采用随机受限抽帧策略，基于 Attention Pooling，每个协议最多保留 6 帧。"
    sampling_strategy: "random_limited"
    sampling_name: "旧随机受限抽帧"
    pooling: "attention"
    method: "随机受限抽帧 + Attention Pooling + 最多6帧"
    top_k: 6
    n_clusters: 3
    boundary_threshold: 0.8
