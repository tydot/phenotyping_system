# =============================================================
# ARM 功能表型系统 - Jetson Orin Nano Super 8GB 部署配置
# 使用方式：docker compose -f docker-compose.jetson.yml up -d
# =============================================================

version: "3.8"

services:
  neo4j:
    image: neo4j:5.20
    container_name: arm_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_PLUGINS: '["apoc"]'
      # Jetson 内存优化：限制 JVM 堆和页缓存（8GB 总内存预算）
      NEO4J_server_memory_heap_max__size: "768m"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_import:/import
      - ./neo4j_plugins:/plugins
    deploy:
      resources:
        limits:
          memory: 1536m
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    container_name: arm_app
    ports:
      - "8501:8501"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=12345678
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./processed:/app/processed
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./app_data.db:/app/app_data.db
      - ./.env:/app/.env:ro
    # PyTorch 共享内存
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 5g
    # Jetson GPU 访问（需要 nvidia-container-runtime）
    runtime: nvidia
    restart: unless-stopped
